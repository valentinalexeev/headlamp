# Runs the repository checks that are not tied to one image: shell lint and script tests, Terraform module format and
# validation, Ansible syntax, a secret scan of the new commits, and the commit subjects. Adapted from agentdev's ci.yml.
# Every job always reports, so branch protection never waits on a skipped workflow; heavy steps run only when their
# inputs changed. Image builds and their tests stay in images.yml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-26.04
    outputs:
      shell: ${{ steps.f.outputs.shell }}
      terraform: ${{ steps.f.outputs.terraform }}
      ansible: ${{ steps.f.outputs.ansible }}
      base: ${{ steps.f.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            files=$(git ls-files); BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          {
            echo "base=$BASE"
            echo "shell=$(has '(\.sh$|^scripts/|^\.githooks/|^Makefile$|^\.github/workflows/ci\.yml$)')"
            echo "terraform=$(has '(^terraform/|^\.github/workflows/ci\.yml$)')"
            echo "ansible=$(has '(^ansible/|^\.github/workflows/ci\.yml$)')"
          } >>"$GITHUB_OUTPUT"

  commits:
    needs: scope
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PRs merge with a merge commit, so every commit subject reaches the history the release check reads.
      - name: Conventional commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          fail=0
          while IFS= read -r s; do scripts/check-conventional.sh "$s" || fail=1; done \
            < <(git log --no-merges --format=%s "$BASE..HEAD")
          exit "$fail"
      - name: Secret scan of the new commits (gitleaks)
        env:
          BASE: ${{ needs.scope.outputs.base }}
          # The official image from the gitleaks project, pinned by digest, instead of a tarball from the GitHub release
          # CDN (that CDN gave HTTP 504 for hours on 2026-11-08 and failed this job).
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && exec gitleaks git --no-banner --redact --log-opts="$0..HEAD" .' "$BASE"

  shell:
    needs: scope
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.shell == 'true'
      - name: Lint and script tests
        if: needs.scope.outputs.shell == 'true'
        run: |
          make lint
          make test-tf-run test-check-denylist test-exit-node-state test-headscale-policy \
            test-headscale-tag-node test-tasks-cli test-release
      - name: Skipped
        if: needs.scope.outputs.shell != 'true'
        run: echo "no shell, script or Makefile change"

  pins:
    # Cheap, so it runs on every PR and push: a changed pin anywhere must agree with TAILSCALE_VERSION and
    # HEADSCALE_VERSION (#145, #150, #152).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tailscale and headscale pins agree
        run: |
          make check-tailscale-pins test-tailscale-pins
          make check-headscale-pin test-headscale-pin

  go-lint:
    # ADR 0002 checks (#160). New code is strict (--new-from-rev); the full report is warnings only. The Make
    # targets run the pinned golangci-lint image.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: golangci-lint (new code, strict)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: make lint-go LINT_BASE_REV="origin/$BASE_REF"
      - name: golangci-lint (full report, warnings)
        run: make lint-go-report

  vulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: make vulncheck

  config-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: make lint-config

  terraform:
    needs: scope
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.terraform == 'true'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: needs.scope.outputs.terraform == 'true'
        with:
          terraform_wrapper: false
      # Provider cache: the registry sends some providers (yandex, oci) through GitHub release downloads, which gave
      # HTTP 503/504 for hours on 2026-11-08. With the cache, init needs no download when the lock files match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.scope.outputs.terraform == 'true'
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/modules/**/versions.tf', 'terraform/modules/**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-
      - name: Format and validate the modules
        if: needs.scope.outputs.terraform == 'true'
        run: |
          TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"; export TF_PLUGIN_CACHE_DIR
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform fmt -check -recursive terraform
          for m in terraform/modules/exit-node-vm/*/; do
            # cloudru's provider is not on the public registry (see its versions.tf): format only.
            case $m in */cloudru/) continue ;; esac
            echo "::group::$m"
            # Up to 3 tries: a provider download can fail on a short CDN error.
            ok=0
            for try in 1 2 3; do
              if terraform -chdir="$m" init -backend=false -input=false; then ok=1; break; fi
              echo "init failed (try $try of 3)"; sleep $((try * 20))
            done
            [ "$ok" = 1 ] || exit 1
            terraform -chdir="$m" validate
            echo "::endgroup::"
          done
      - name: Skipped
        if: needs.scope.outputs.terraform != 'true'
        run: echo "no Terraform change"

  ansible:
    needs: scope
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.ansible == 'true'
      - name: Syntax check the playbooks
        if: needs.scope.outputs.ansible == 'true'
        working-directory: ansible
        run: |
          pipx install --include-deps ansible-core
          ansible-galaxy collection install -r requirements.yml
          for p in playbooks/*.yml; do ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, --syntax-check "$p"; done
      - name: Role preflight tests
        if: needs.scope.outputs.ansible == 'true'
        run: make test-ansible-roles
      - name: Skipped
        if: needs.scope.outputs.ansible != 'true'
        run: echo "no Ansible change"

  ansible-os:
    # The roles on each supported OS image, in a systemd container with a real headscale (#170). route-provisioner gets
    # a full apply; ingress-agent runs in check mode until its apply passes in a container (#178).
    needs: scope
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-minimal, ubuntu-server, debian13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.ansible == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.scope.outputs.ansible == 'true'
        with:
          go-version-file: apps/ingress-agent/go.mod
      - name: OS matrix
        if: needs.scope.outputs.ansible == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # The target comes with #170: skip cleanly on a tree that does not have it yet.
          if ! make -n test-ansible-os >/dev/null 2>&1; then echo "no test-ansible-os target in this tree"; exit 0; fi
          pipx install --include-deps ansible-core
          ansible-galaxy collection install community.docker ansible.posix
          make test-ansible-os IMAGE="$IMAGE" ROLES="route-provisioner ingress-agent" APPLY="route-provisioner"
      - name: Skipped
        if: needs.scope.outputs.ansible != 'true'
        run: echo "no Ansible change"
