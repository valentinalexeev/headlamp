# Builds, tests and publishes the images in .github/components.json. Only a component whose source changed is rebuilt:
# each image carries a src-<hash> tag naming what it was built from, and a tag that already exists is reused. A release
# therefore points at the same image main published, with no rebuild. See VERSIONING.md.
name: images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every image even if its source has not changed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Release preflight (#192): every Ansible role in check mode in a systemd container, every image (the src-<hash>
  # image from the registry when it exists, else built), and every app with an example overlay built and started with
  # its fly.toml process commands (also those of the previous release).
  # Runs on tags and on release/ PRs; a tag cannot pass the gate while it fails. A tag on the merge commit of a
  # release PR reuses the PR's result when the PR head passed the preflight and has the same tree as the tag.
  preflight:
    if: github.ref_type == 'tag' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reuse the preflight of the release PR
        id: reuse
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag must be a merge commit whose second parent (the PR head) has exactly the same tree, and the
          # preflight check of that commit must have passed. Anything else runs the full preflight.
          head=$(git rev-parse -q --verify 'HEAD^2' || true)
          if [ -n "$head" ] && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=preflight" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
            if [ "${ok:-0}" -gt 0 ]; then
              echo "the release PR head $head passed the preflight with the same tree: reusing it"
              echo "reused=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "no passed preflight for the same tree: running the full preflight"
      - name: Install ansible
        if: steps.reuse.outputs.reused != 'true'
        run: |
          pipx install --include-deps ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-galaxy collection install community.docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.reuse.outputs.reused != 'true'
        with:
          go-version-file: apps/ingress-agent/go.mod
          cache-dependency-path: apps/*/go.sum
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.reuse.outputs.reused != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run the release preflight
        if: steps.reuse.outputs.reused != 'true'
        run: |
          PREFLIGHT_PULL="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/release-preflight.sh HEAD

  gate:
    needs: preflight
    # Runs also when preflight failed, and fails then: a skipped gate would let detect publish.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the release preflight
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
        run: |
          test "$PREFLIGHT" = success || { echo "release preflight result is $PREFLIGHT"; exit 1; }
      - name: Check the release rules
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/check-release.sh "$TAG" origin/main

  detect:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      all: ${{ steps.components.outputs.all }}
      build: ${{ steps.components.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find what needs building
        id: components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          all=$(scripts/ci-components.sh list)
          if [ "$EVENT" = pull_request ]; then
            build=$(scripts/ci-components.sh changed "$BASE_SHA" HEAD)
          elif [ "$REBUILD_ALL" = true ]; then
            build=$all
          else
            build='[]'
            prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
            while IFS= read -r c; do
              ref="$prefix/$(jq -r .image <<<"$c"):src-$(jq -r .hash <<<"$c")"
              if docker manifest inspect "$ref" >/dev/null 2>&1; then
                echo "reusing $ref"
              else
                echo "building $ref"
                build=$(jq -c --argjson c "$c" '. + [$c]' <<<"$build")
              fi
            done < <(jq -c '.[]' <<<"$all")
          fi
          echo "all=$all" >>"$GITHUB_OUTPUT"
          echo "build=$build" >>"$GITHUB_OUTPUT"

  build:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.build != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        c: ${{ fromJSON(needs.detect.outputs.build) }}
    # The per-image name is readable when the matrix runs. When nothing needs a build, GitHub skips the job before it
    # expands the matrix and shows the raw template; images-build below is the fixed check for both cases.
    name: build (${{ matrix.c.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.c.go
        with:
          go-version-file: ${{ matrix.c.context }}/go.mod
          cache-dependency-path: ${{ matrix.c.context }}/go.sum
      - name: Test
        if: matrix.c.test != ''
        env:
          TEST: ${{ matrix.c.test }}
        run: bash -c "$TEST"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.c.platforms != 'linux/amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Name the image
        id: name
        env:
          IMAGE: ${{ matrix.c.image }}
          HASH: ${{ matrix.c.hash }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE:src-$HASH" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.c.context }}
          file: ${{ matrix.c.context }}/${{ matrix.c.dockerfile }}
          build-args: ${{ matrix.c.build_args }}
          platforms: ${{ matrix.c.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.name.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.c.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.c.image }}

  # One check with a fixed name for the matrix above. A skipped matrix job has no matrix values, so GitHub shows
  # its name as the raw "build (${{ matrix.c.image }})"; this job always runs and gives one stable result: it fails
  # when the detection or any image build failed, and passes when they passed or nothing needed a build.
  images-build:
    needs: [detect, build]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Result of the image builds
        env:
          DETECT: ${{ needs.detect.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "detect=$DETECT build=$BUILD"
          [ "$DETECT" = success ] || { echo "the detection did not succeed"; exit 1; }
          case "$BUILD" in success|skipped) echo "image builds: ok" ;; *) echo "an image build failed"; exit 1 ;; esac

  publish:
    needs: [detect, build]
    if: >-
      always() && github.event_name != 'pull_request' && needs.detect.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the GitHub release of a tag
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag every image for this ref
        env:
          ALL: ${{ needs.detect.outputs.all }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            mapfile -t tags < <(scripts/ci-image-tags.sh tag "$REF_NAME")
          else
            mapfile -t tags < <(scripts/ci-image-tags.sh branch "$GITHUB_SHA")
          fi
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          while IFS= read -r c; do
            name="$prefix/$(jq -r .image <<<"$c")"
            args=()
            for t in "${tags[@]}"; do args+=(-t "$name:$t"); done
            docker buildx imagetools create "${args[@]}" "$name:src-$(jq -r .hash <<<"$c")"
          done < <(jq -c '.[]' <<<"$ALL")
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: github.ref_type == 'tag'
      - name: Publish the Helm charts (#158)
        # Each chart under charts/ is published as an OCI artifact with the release version, so a chart version
        # always names the images of the same release. The chart in the repo keeps a placeholder version.
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          registry="oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/charts"
          for chart in charts/*/; do
            helm lint "$chart"
            helm package "$chart" --version "$version" -d "$RUNNER_TEMP/charts"
          done
          for pkg in "$RUNNER_TEMP"/charts/*.tgz; do helm push "$pkg" "$registry"; done
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flag=()
          case "$TAG" in *-*) flag=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --generate-notes "${flag[@]}"
