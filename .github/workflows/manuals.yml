# Checks the manuals that a pull request changes against docs/writing-manuals.md.
name: manuals
on:
  pull_request:
    branches: [main]
    paths: ['**.md', 'scripts/check-manual-style.py', 'scripts/list-manuals.sh', '.github/workflows/manuals.yml']
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the check
        run: scripts/test/manual-style/run_tests.sh
      - name: Check the changed manuals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(scripts/list-manuals.sh "$BASE_SHA")
          if [ "${#files[@]}" -gt 0 ]; then
            scripts/check-manual-style.py "${files[@]}"
          fi
