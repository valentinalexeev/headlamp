# The agent is not an image: it drives xray on its host through systemd, and Ansible builds and installs it. Only its
# tests and its resource budget (#133) run here.
name: test-ingress-agent
on:
  push:
    branches: [main]
    paths: ['apps/ingress-agent/**', 'scripts/test/ingress-agent-budget/**', '.github/workflows/test-ingress-agent.yml']
  pull_request:
    branches: [main]
    paths: ['apps/ingress-agent/**', 'scripts/test/ingress-agent-budget/**', '.github/workflows/test-ingress-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/ingress-agent/go.mod
          cache: false
      - name: Test
        run: make test-ingress-agent
      - name: Resource budget
        run: sh scripts/test/ingress-agent-budget/budget.sh
