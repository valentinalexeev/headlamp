# Publishes the documentation of a release to the GitHub wiki when its tag is pushed, so the wiki shows released docs,
# not work in progress on main. Run it by hand to republish the newest release. The repository is the reviewed source;
# the wiki is a copy (scripts/wiki-render.sh).
name: wiki
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write # the wiki is pushed with the workflow token
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the release
        id: ref
        run: |
          # A tag push publishes that tag; a manual run publishes the newest stable tag (pre-releases are skipped).
          if [ "$GITHUB_REF_TYPE" = tag ]; then ref=$GITHUB_REF_NAME; else
            ref=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$ref" ] || { echo "no release tag yet, nothing to publish"; exit 1; }
          git checkout -q "$ref"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - name: Render and push
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" "$RUNNER_TEMP/wiki"
          scripts/wiki-render.sh "$RUNNER_TEMP/wiki" "$REPO" "$REF"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki up to date"; exit 0; }
          git commit -qm "docs: sync from ${REF}"
          git push -q
