[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
# Explicit roles_path: Ansible's default role search only looks in a
# "roles/" subdirectory of the PLAYBOOK's own directory. site.yml (in
# ansible/) finds ansible/roles/ that way by luck; playbooks/*.yml (in
# ansible/playbooks/) would otherwise search ansible/playbooks/roles/ and
# fail to find any role. This makes every playbook, regardless of its own
# subdirectory, resolve roles from the same place.
roles_path = roles
# host_group_vars keeps the normal group_vars/host_vars loading working;
# community.sops.sops adds transparent decryption for *.sops.yaml files in the
# same directories, so vault.sops.yaml loads like any other group_vars file.
# (This is `vars_plugins_enabled` under [defaults], NOT `enable_plugins`
# under a `[vars]` section — the latter is not a real ansible-core config
# key and silently does nothing; verified live during Task 11's review.)
vars_plugins_enabled = host_group_vars, community.sops.sops
