---
# Ingress agent (apps/ingress-agent) as a systemd service next to xray.
# Values marked REQUIRED have no default on purpose; preflight.yml fails
# early if they are missing. Real values live in the private repo / vault.

# Path ON THE CONTROL HOST to the apps/ingress-agent directory (REQUIRED),
# e.g. "{{ playbook_dir }}/../vendor/headlamp/apps/ingress-agent". The Go agent
# is built from it on the control host (Go 1.26 or later there) and copied.
ingress_agent_src: ""
# Bearer token the operator side uses to push credentials (REQUIRED, vault,
# at least 32 characters). Never logged, never on a command line.
ingress_agent_token: ""
# TCP port, bound on the host's tailnet address only.
ingress_agent_port: 9000

# Install locations. <ingress_agent_dir>/app held the former Python agent; the role removes that tree.
ingress_agent_bin: /usr/local/bin/ingress-agent
ingress_agent_dir: /opt/ingress-agent
# Where the control host keeps the built binaries (one for each architecture).
ingress_agent_build_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/ingress-agent-build"
# Must be under /var/lib/ (the unit derives StateDirectory= from it).
ingress_agent_state_dir: /var/lib/ingress-agent
ingress_agent_env_file: /etc/ingress-agent/env


# What the agent drives. The defaults match the reality-ingress role.
xray_bin: /usr/local/bin/xray
xray_unit: xray
xray_api: "127.0.0.1:10085"
xray_base_config: /etc/xray/config.base.json
xray_config: /etc/xray/config.json
# Optional direct lists for `auto` mode: geodata list names (e.g. ["xx"] for geoip:xx / geosite:xx entries);
# destinations on them leave from this host instead of the exit node. Empty = everything uses the exit node.
ingress_direct_geoip: []
ingress_direct_geosite: []
# Resolvers xray uses for its own lookups (routing needs the IP of every domain destination). The agent routes these
# queries through the exit node (outbound via-exit), so the bridge's network never sees the visited names; only names
# on ingress_direct_geosite resolve with the system resolver. Each entry: https://<ipv4>/<path> or tcp://<ipv4>[:port]
# (TCP only, through the SOCKS outbound). Empty = https://1.1.1.1/dns-query, https://1.0.0.1/dns-query.
ingress_exit_dns: []
# Bridge path self-test (#196): the agent requests ingress_egress_url through the SOCKS port of the exit node
# (the via-exit outbound) every minute, and serves the result at GET /v1/egress. node-control shows an Attention
# item when it fails: clients then connect and get no reply. The default is the socks_listen of reality-ingress.
# Empty: no self-test. It sends one HEAD request a minute through the exit node, and opens no port.
ingress_egress_socks: "{{ socks_listen | default('127.0.0.1:1055') }}"
ingress_egress_url: "https://www.gstatic.com/generate_204"

# Geodata directory (xray run -test needs it for geoip:/geosite: rules).
xray_asset_dir: /usr/local/share/xray

# Public parameters served at GET /v1/info (all optional; the endpoint answers
# 503 until name, host, public key and short id are all set). Public values
# only: never put the Reality private key here. These names match the
# reality-ingress role, so one set of group variables serves both roles.
# Short label of this ingress, e.g. "ingress-1": [a-z0-9-], at most 32 chars.
ingress_name: ""
ingress_host: ""
ingress_listen_port: 443
reality_sni: "{{ ingress_host }}"
reality_short_id: ""
# Public half of the vaulted reality_private_key: `xray x25519 -i <private key>`
# prints it as "Password (PublicKey)". Empty = not exported.
reality_public_key: ""
