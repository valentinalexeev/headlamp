---
# xray VLESS+Reality entry point with a Caddy "self-steal" front.
# Values marked REQUIRED have no default on purpose; preflight.yml fails
# early if they are missing. Real values live in the private repo / vault.

# Public hostname of the ingress (REQUIRED). It must resolve to this host:
# Let's Encrypt validates it over HTTP-01 on port 80.
ingress_host: ""
# Public port of the Reality inbound.
ingress_listen_port: 443

# Reality (REQUIRED, vault). Private key from `xray x25519`; short id is
# 2-16 hex chars (`openssl rand -hex 8`). The public key is not used by this
# role; it is only passed on to the ingress agent (role `ingress-agent`) for
# GET /v1/info.
reality_private_key: ""
reality_short_id: ""
# Public half of reality_private_key: `xray x25519 -i <private key>` prints it
# ("Password (PublicKey)"). Optional; empty = the agent does not publish it.
reality_public_key: ""
# Short label of this ingress for discovery (ingress-agent role), e.g. "ingress-1".
ingress_name: ""
reality_sni: "{{ ingress_host }}"
# The self-steal target: the loopback TLS site of the Caddy front.
reality_dest: "127.0.0.1:8443"

# Hysteria 2 inbound (#110), on UDP beside the Reality inbound on TCP. On by default.
# Its TLS certificate is the HTTP-01 certificate that Caddy already gets for ingress_host:
# a timer copies it to hy2_tls_dir, readable by xray, and restarts xray when it changes.
hy2_enabled: true
hy2_listen_port: 443
# Salamander obfuscation password (REQUIRED when hy2_enabled, vault). `openssl rand -hex 16`.
# node-control needs the same value in HY2_OBFS_<NAME> to put it into client profiles.
hy2_obfs_password: ""
hy2_tls_dir: /etc/xray/tls
# How often the certificate copy runs (systemd time span). Caddy renews about 30 days before expiry.
hy2_cert_sync_interval: 6h

# Binaries and geodata come from the official images, pinned by digest (#182). The control host pulls only the
# needed files from the registry with files/oci-extract.py (Python standard library; no docker, skopeo or crane).
# The digest names an image index; the manifest of the node architecture is used (amd64 for x86_64, arm64 for
# aarch64). Each binary is checked against its sha256 for that architecture (#178).
# To update: change the digest and all sha256 values together.
xray_image: "ghcr.io/xtls/xray-core@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9"  # 26.10.31
xray_image_path: /usr/local/bin/xray
xray_image_sha256:
  amd64: 96d903d9b27e45dba5a346159a212a9fc5b3cd91e6023aa99240703e555cfc4f
  arm64: ae655aea533856b8c8bfec6c022a93ef8daea1475cfa27baeba709799ef6ee5e
# Directory of the geodata files in xray_image.
xray_image_geodata_dir: /usr/local/share/xray
caddy_image: "docker.io/library/caddy@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0"  # 2.11.9
caddy_image_path: /usr/bin/caddy
caddy_image_sha256:
  amd64: a563843e11cbce39c557bd429ebb787d56f49d51d9bbb3292cd9b36b37a60cdf
  arm64: 762d7763ed8e303d50bf11fb0274627266907ea8c170720d7d9a6fd0b9bf5c65

# Control-host cache of the pulled and downloaded files (#198): <dir>/<sha256>/<name>. Each file is hashed again on
# every run before use. Safe to delete; the next run fills it again.
reality_ingress_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/headlamp/reality-ingress"

# Override: a release archive from a URL (for example a mirror) instead of the image. Empty = use the image.
# The archive must match the node architecture.
# xray: the linux zip that holds `xray`; xray_sha256 is the sha256 of the ARCHIVE.
# xray_version is only a convenience for building the URL.
xray_version: ""
xray_url: ""
xray_sha256: ""
# caddy: the linux .tar.gz that holds `caddy`; caddy_sha256 is the sha256 of the ARCHIVE.
caddy_version: ""
caddy_url: ""
caddy_sha256: ""

# Geodata files (the same for every architecture), each {name, sha256} and an optional url. Without url the file comes from
# xray_image:xray_image_geodata_dir/<name>. At least geoip.dat and geosite.dat (the ingress agent's optional
# direct lists, ingress_direct_geoip / ingress_direct_geosite, refer to entries of these files).
xray_geodata_files:
  - {name: geoip.dat, sha256: 25c565059df54d9fb8613ee3ac525e9e7fbc48cc4e6b4e1b28301941b6951f52}
  - {name: geosite.dat, sha256: 58ada34ddc20634f7170a2387bf72bc3a00a0fcea717aa067a39daaa07db58e9}

# host:port of the enrolment listener the front proxies /e/* and /sub/* to
# (REQUIRED), e.g. "node-control.example.net:8081" or "<tailnet-ip>:8081".
# No scheme, no path.
enroll_upstream: ""
# Self-enrolment with OIDC (#102): also proxy /me, /me/devices[/<id>/revoke], /me/logout and /oidc/{login,callback}
# to enroll_upstream. Off by default: the front then serves only /e/ and /sub/.
enroll_self_service: false

# Loopback SOCKS5 port of the `tailscale-userspace-socks` role: the xray
# outbound `via-exit` dials it. Must be loopback.
socks_listen: "127.0.0.1:1055"
# Tailnet grant groups (#139): the same list as in the `tailscale-userspace-socks` role. Each id gets the outbound
# via-tailnet-<id> to 127.0.0.1:<socks_grant_port_base + index>. Only "id" is read here.
socks_grant_groups: []
socks_grant_port_base: 1056

xray_user: xray
# xray stats API (loopback only); the ingress agent reads traffic from it.
xray_api_listen: "127.0.0.1:10085"

# nftables backstop (tasks/guard.yml): ruleset file and nft binary.
ingress_guard_file: /etc/ingress-guard.nft
# IPv4 resolvers xray may query on port 53 although they are on loopback or a
# private network: the system resolver from /etc/resolv.conf (the
# systemd-resolved stub on Ubuntu). xray's own lookups fail without it. Hosts whose resolv.conf is managed by a
# tailnet client list a tailnet resolver (100.100.100.100): add it here too. Preflight fails when a blocked-range
# IPv4 resolver is missing from this list.
ingress_guard_resolvers: ["127.0.0.53"]
nft_bin: /usr/sbin/nft
# How often the guard check timer verifies that the nftables table exists and reapplies it if not (systemd time span).
ingress_guard_check_interval: 30s
# Unit of the ingress agent; restarted when config.base.json changes (only if
# the unit file exists), so its startup restore re-renders config.json.
ingress_agent_unit: ingress-agent

# Install locations.
xray_bin: /usr/local/bin/xray
xray_asset_dir: /usr/local/share/xray
xray_config_dir: /etc/xray
caddy_bin: /usr/local/bin/caddy
caddy_user: caddy
caddy_config_dir: /etc/caddy-ingress
# Must be under /var/lib/ (the unit derives StateDirectory= from it).
caddy_state_dir: /var/lib/caddy-ingress
