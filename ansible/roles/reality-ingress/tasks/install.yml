---
# Binaries are fetched on the CONTROL host (hosts in restricted networks often cannot reach
# a registry or GitHub): by default pulled from the pinned official images (#182), or from
# xray_url / caddy_url; sha256-verified, unpacked there, then copied to the
# target. Everything is staged in a fresh per-run temp dir that is removed in
# `always:`, so nothing unpacked on an earlier run (a predictable path an
# attacker could have planted in) is ever installed. Check mode: downloads are
# reported, unpack/copy of binaries is skipped.
- name: Create the xray and caddy system users
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  loop:
    - "{{ xray_user }}"
    - "{{ caddy_user }}"
  become: true

# setgid: files the root-run ingress agent replaces here inherit group xray.
- name: Create the xray config directory
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    owner: root
    group: "{{ xray_user }}"
    mode: "2750"
  become: true

- name: Create the xray asset directory
  ansible.builtin.file:
    path: "{{ xray_asset_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Stage, verify and install the binaries
  vars:
    # Files that come from an image, with the sha256 they must have.
    # Stage path and pinned sha256 of each file that comes from an image (geodata without url: geodata/<name>).
    reality_image_files: >-
      {{ ([{'path': 'xray/xray', 'sha256': xray_image_sha256}] if xray_url | length == 0 else [])
         + ([{'path': 'caddy/caddy', 'sha256': caddy_image_sha256}] if caddy_url | length == 0 else [])
         + (xray_geodata_files | selectattr('url', 'undefined') | list) }}
  block:
    - name: Create a fresh stage directory on the control host
      ansible.builtin.tempfile:
        state: directory
        prefix: reality-ingress.
      delegate_to: localhost
      become: false
      register: reality_stage
      # A real (empty) temp dir even in check mode; removed in `always`.
      check_mode: false

    - name: Create the stage subdirectories
      ansible.builtin.file:
        path: "{{ reality_stage.path }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [xray, caddy, geodata, image, image-caddy]
      delegate_to: localhost
      become: false
      check_mode: false

    # Default (#182): the files come from the official images, pinned by digest, through a small registry pull
    # (files/oci-extract.py, standard library) with the Python that runs Ansible. One pull of xray_image gives
    # the binary and the geodata files without url. The script checks the digest of every manifest and layer.
    - name: Pull the needed files from the xray image to the control host
      ansible.builtin.command:
        argv: >-
          {{ [ansible_playbook_python, role_path ~ '/files/oci-extract.py', xray_image, reality_stage.path ~ '/image']
             + ([xray_image_path] if xray_url | length == 0 else [])
             + (xray_geodata_files | selectattr('url', 'undefined')
                | map(attribute='name') | map('regex_replace', '^', xray_image_geodata_dir ~ '/') | list) }}
      changed_when: true
      delegate_to: localhost
      become: false
      when: >-
        not ansible_check_mode and
        (xray_url | length == 0 or xray_geodata_files | selectattr('url', 'undefined') | list | length > 0)

    - name: Pull the caddy binary from the caddy image to the control host
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/oci-extract.py"
          - "{{ caddy_image }}"
          - "{{ reality_stage.path }}/image-caddy"
          - "{{ caddy_image_path }}"
      changed_when: true
      delegate_to: localhost
      become: false
      when: not ansible_check_mode and caddy_url | length == 0

    - name: Move the xray binary from the image stage
      ansible.builtin.command:
        argv:
          - mv
          - "{{ reality_stage.path }}/image/{{ xray_image_path | basename }}"
          - "{{ reality_stage.path }}/xray/xray"
      changed_when: true
      delegate_to: localhost
      become: false
      when: not ansible_check_mode and xray_url | length == 0

    - name: Move the caddy binary from the image stage
      ansible.builtin.command:
        argv:
          - mv
          - "{{ reality_stage.path }}/image-caddy/{{ caddy_image_path | basename }}"
          - "{{ reality_stage.path }}/caddy/caddy"
      changed_when: true
      delegate_to: localhost
      become: false
      when: not ansible_check_mode and caddy_url | length == 0

    - name: Move the geodata files from the image stage
      ansible.builtin.command:
        argv: [mv, "{{ reality_stage.path }}/image/{{ item.name }}", "{{ reality_stage.path }}/geodata/{{ item.name }}"]
      changed_when: true
      loop: "{{ xray_geodata_files | selectattr('url', 'undefined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    # Override: release archives from a URL (for example a mirror).
    - name: Download xray (zip) to the control host
      ansible.builtin.get_url:
        url: "{{ xray_url }}"
        dest: "{{ reality_stage.path }}/xray.zip"
        checksum: "sha256:{{ xray_sha256 }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: xray_url | length > 0

    - name: Download caddy (tar.gz) to the control host
      ansible.builtin.get_url:
        url: "{{ caddy_url }}"
        dest: "{{ reality_stage.path }}/caddy.tar.gz"
        checksum: "sha256:{{ caddy_sha256 }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: caddy_url | length > 0

    - name: Download the geodata files that have a url to the control host
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ reality_stage.path }}/geodata/{{ item.name }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0600"
      loop: "{{ xray_geodata_files | selectattr('url', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false

    - name: Unpack xray on the control host (only the verified archive)
      ansible.builtin.unarchive:
        src: "{{ reality_stage.path }}/xray.zip"
        dest: "{{ reality_stage.path }}/xray"
        remote_src: true
      delegate_to: localhost
      become: false
      when: not ansible_check_mode and xray_url | length > 0

    # Plain `tar`, not ansible.builtin.unarchive: unarchive refuses the BSD tar that macOS control hosts have
    # ("GNU tar required"). `tar -xzf` works with both; only the `caddy` binary is extracted.
    - name: Unpack caddy on the control host (only the verified archive)
      ansible.builtin.command:
        argv:
          - tar
          - -xzf
          - "{{ reality_stage.path }}/caddy.tar.gz"
          - -C
          - "{{ reality_stage.path }}/caddy"
          - caddy
      changed_when: true
      delegate_to: localhost
      become: false
      when: not ansible_check_mode and caddy_url | length > 0

    # A binary from an image is checked here against its pinned sha256 (an archive was checked by get_url).
    # Geodata from the image is checked against item.sha256 in the same way.
    - name: Hash the staged files from the images
      ansible.builtin.stat:
        path: "{{ reality_stage.path }}/{{ item.path if 'path' in item else 'geodata/' ~ item.name }}"
        checksum_algorithm: sha256
        get_checksum: true
      loop: "{{ reality_image_files }}"
      loop_control:
        label: "{{ item.path if 'path' in item else item.name }}"
      register: reality_image_hashes
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Check the sha256 of each file from an image
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.checksum == item.item.sha256
        fail_msg: "reality-ingress: sha256 mismatch for {{ item.item.path if 'path' in item.item else item.item.name }} from the image"
        quiet: true
      loop: "{{ reality_image_hashes.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path if 'path' in item.item else item.item.name }}"
      when: not ansible_check_mode

    - name: Install the xray binary
      ansible.builtin.copy:
        src: "{{ reality_stage.path }}/xray/xray"
        dest: "{{ xray_bin }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      when: not ansible_check_mode
      notify: restart xray

    - name: Install the geodata files
      ansible.builtin.copy:
        src: "{{ reality_stage.path }}/geodata/{{ item.name }}"
        dest: "{{ xray_asset_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ xray_geodata_files }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      when: not ansible_check_mode
      notify: restart xray

    - name: Install the caddy binary
      ansible.builtin.copy:
        src: "{{ reality_stage.path }}/caddy/caddy"
        dest: "{{ caddy_bin }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      when: not ansible_check_mode
      notify: restart caddy-ingress

  always:
    - name: Remove the control-host stage directory
      ansible.builtin.file:
        path: "{{ reality_stage.path }}"
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false
      when: reality_stage.path is defined

- name: Create the caddy config directory
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    owner: root
    group: "{{ caddy_user }}"
    mode: "0750"
  become: true

- name: Install the xray unit
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    mode: "0644"
  become: true
  notify: restart xray

- name: Install the caddy-ingress unit
  ansible.builtin.template:
    src: caddy-ingress.service.j2
    dest: /etc/systemd/system/caddy-ingress.service
    mode: "0644"
  become: true
  notify: restart caddy-ingress
