---
- name: Check required variables are set
  ansible.builtin.assert:
    that:
      - ingress_host | length > 0
      - reality_private_key | length > 0
      - reality_short_id | length > 0
      - enroll_upstream | length > 0
      - xray_geodata_files | length > 0
    fail_msg: >-
      reality-ingress: ingress_host, reality_private_key, reality_short_id, enroll_upstream
      and a non-empty xray_geodata_files must all be set (secrets from a vault).
    quiet: true

- name: Check ingress_host is a plain hostname
  ansible.builtin.assert:
    that:
      - ingress_host is regex('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\\Z')
      - reality_sni is regex('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\\Z')
    fail_msg: >-
      reality-ingress: ingress_host / reality_sni must be a plain hostname
      (no scheme, port, slash or whitespace).
    quiet: true

- name: Check the Reality credentials have the right shape
  ansible.builtin.assert:
    that:
      - reality_short_id is regex('^([0-9A-Fa-f]{2}){1,8}\\Z')
      - reality_private_key is regex('^[A-Za-z0-9_-]{43}\\Z')
    fail_msg: >-
      reality-ingress: reality_short_id must be hex of even length, at most 16
      characters; reality_private_key must be an `xray x25519` private key
      (43 base64url characters). The values are not shown.
    quiet: true

- name: Check the listen and upstream addresses
  ansible.builtin.assert:
    that:
      - socks_listen is regex('^(127\\.0\\.0\\.1|\\[::1\\]):[0-9]{1,5}\\Z')
      - xray_api_listen is regex('^(127\\.0\\.0\\.1|\\[::1\\]):[0-9]{1,5}\\Z')
      - enroll_upstream is regex('^[A-Za-z0-9.-]+:[0-9]{1,5}\\Z')
      - reality_dest is regex('^[A-Za-z0-9.-]+:[0-9]{1,5}\\Z')
      - ingress_listen_port | string is regex('^[0-9]{1,5}\\Z')
    fail_msg: >-
      reality-ingress: socks_listen and xray_api_listen must be loopback-only
      (127.0.0.1:<port> or [::1]:<port>); enroll_upstream and reality_dest must
      be host:port with no scheme, path or whitespace; ingress_listen_port a number.
      Got socks_listen='{{ socks_listen }}', xray_api_listen='{{ xray_api_listen }}',
      enroll_upstream='{{ enroll_upstream }}'.
    quiet: true

- name: Check ports are in range and the paths/arch are supported
  ansible.builtin.assert:
    that:
      - 1 <= (socks_listen | regex_replace('^.*:([0-9]+)$', '\\1') | int) <= 65535
      - 1 <= (xray_api_listen | regex_replace('^.*:([0-9]+)$', '\\1') | int) <= 65535
      - 1 <= (enroll_upstream | regex_replace('^.*:([0-9]+)$', '\\1') | int) <= 65535
      - 1 <= (reality_dest | regex_replace('^.*:([0-9]+)$', '\\1') | int) <= 65535
      - 1 <= (ingress_listen_port | int) <= 65535
      - caddy_state_dir is regex('^/var/lib/[A-Za-z0-9._-]+\\Z')
      - (ansible_facts.architecture | default('')) == 'x86_64'
    fail_msg: >-
      reality-ingress: every port must be 1-65535; caddy_state_dir must be
      /var/lib/<dir>; only x86_64 hosts are supported (facts must be gathered).
    quiet: true

# Each binary comes from its image (default, #182) or from the URL override; either way a sha256 is checked.
- name: Check the downloads are pinned by checksum
  ansible.builtin.assert:
    that:
      - (xray_url | length > 0 and xray_url is match('https://') and xray_sha256 is regex('^[0-9A-Fa-f]{64}\\Z'))
        or (xray_url | length == 0 and xray_image is regex(reality_image_pattern)
            and xray_image_sha256 is regex('^[0-9a-f]{64}\\Z'))
      - (caddy_url | length > 0 and caddy_url is match('https://') and caddy_sha256 is regex('^[0-9A-Fa-f]{64}\\Z'))
        or (caddy_url | length == 0 and caddy_image is regex(reality_image_pattern)
            and caddy_image_sha256 is regex('^[0-9a-f]{64}\\Z'))
      - "'geoip.dat' in xray_geodata_files | map(attribute='name', default='')"
      - "'geosite.dat' in xray_geodata_files | map(attribute='name', default='')"
      - xray_geodata_files | map(attribute='name', default='') | select('match', '^[A-Za-z0-9._-]+\\Z') | list | length == xray_geodata_files | length
      - xray_geodata_files | selectattr('url', 'defined') | map(attribute='url') | reject('match', '^https://') | list | length == 0
      - xray_geodata_files | selectattr('url', 'undefined') | list | length == 0 or xray_image is regex(reality_image_pattern)
      - xray_geodata_files | map(attribute='sha256', default='') | select('match', '^[0-9a-f]{64}\\Z') | list | length == xray_geodata_files | length
    fail_msg: >-
      reality-ingress: for xray and caddy, set either the image (<registry>/<repository>@sha256:<digest>) with
      xray_image_sha256 / caddy_image_sha256, or the https URL override with xray_sha256 / caddy_sha256
      (64 hex characters). xray_geodata_files must include geoip.dat and geosite.dat; every item needs name
      (plain file name) and a 64-hex sha256 (lower case), and an optional https url (no url = from xray_image).
    quiet: true
  vars:
    # A plain variable is not a Jinja string literal, so one backslash here.
    reality_image_pattern: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}\Z'

- name: Check the nftables backstop inputs
  ansible.builtin.assert:
    that:
      - xray_user is regex('^[a-z_][a-z0-9_-]{0,31}\\Z')
      - ingress_guard_resolvers | length > 0
      - ingress_guard_resolvers | select('match', '^[0-9]{1,3}(\\.[0-9]{1,3}){3}\\Z') | list | length == ingress_guard_resolvers | length
      - ingress_guard_file is regex('^/etc/[A-Za-z0-9._/-]+\\Z')
    fail_msg: >-
      reality-ingress: xray_user must be a plain user name, ingress_guard_resolvers
      a non-empty list of IPv4 addresses (the resolvers in /etc/resolv.conf), and
      ingress_guard_file a path under /etc. Got xray_user='{{ xray_user }}',
      ingress_guard_resolvers={{ ingress_guard_resolvers }}.
    quiet: true

# xray resolves destination names itself, as the unprivileged xray user, and the guard drops its traffic to loopback,
# private, CGNAT/tailnet and link-local addresses. A system resolver in those ranges (a tailnet resolver, a local stub)
# must therefore be allowed explicitly in ingress_guard_resolvers, or `direct` lookups stall and fail.
- name: Read the host's resolver configuration
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: ingress_resolv_conf

- name: Check xray can use every IPv4 system resolver
  ansible.builtin.assert:
    that:
      - ingress_unusable_resolvers | length == 0
    fail_msg: >-
      reality-ingress: /etc/resolv.conf lists IPv4 resolvers {{ ingress_unusable_resolvers }} that the nftables
      backstop blocks for the xray user (loopback, private, CGNAT/tailnet or link-local range) and that are not in
      ingress_guard_resolvers. Add them there (xray may then query them on port 53 only), or point resolv.conf at
      resolvers outside those ranges. Without this, `direct` outbound lookups time out.
    quiet: true
  vars:
    ingress_resolvers: >-
      {{ (ingress_resolv_conf.content | b64decode).splitlines()
         | select('match', '^[ \t]*nameserver[ \t]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+[ \t]*$')
         | map('regex_replace', '^[ \t]*nameserver[ \t]+([0-9.]+)[ \t]*$', '\1') | list }}
    ingress_unusable_resolvers: >-
      {{ ingress_resolvers
         | select('match', '^(0[.]|10[.]|127[.]|169[.]254[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|192[.]168[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.])')
         | reject('in', ingress_guard_resolvers) | list }}

- name: Check the Hysteria 2 settings
  ansible.builtin.assert:
    that:
      - hy2_obfs_password is regex('^[A-Za-z0-9_-]{16,128}\\Z')
      - 1 <= (hy2_listen_port | int) <= 65535
      - hy2_tls_dir is regex('^/[A-Za-z0-9._/-]+\\Z')
    fail_msg: >-
      reality-ingress: Hysteria 2 is on by default (hy2_enabled: true) and opens UDP hy2_listen_port (443).
      To keep it, set hy2_obfs_password to 16-128 characters of [A-Za-z0-9_-] (vault; `openssl rand -hex 16`),
      hy2_listen_port 1-65535 and hy2_tls_dir an absolute path, and let the cloud firewall pass that UDP port.
      To turn it off, set hy2_enabled: false (only the Reality inbound on TCP runs). The values are not shown.
    quiet: true
  no_log: true
  when: hy2_enabled | bool
