route_asns: []
route_hosts: []
# Hosts resolved to their exact current IPs (/32) and advertised directly,
# WITHOUT the ASN-expansion route_hosts/route_asns get. Use this for hosts
# on large shared cloud/CDN infrastructure (AWS, Cloudflare, etc.) where
# the ASN owns far more than the service you actually want to route —
# expanding to the whole ASN would advertise huge amounts of unrelated
# traffic through this exit node. Re-resolved every cron cycle, so IP
# rotation is handled, just less robust than ASN-based coverage for
# services that genuinely sit on a small, dedicated-to-that-country ASN.
route_hosts_direct: []
route_min_prefix_v4: 8
route_max_prefix_v4: 32
route_cron_interval_hours: 3
# Reachability gate. A host from route_hosts / route_hosts_direct is published (its addresses, the ASNs they sit in,
# its /32s) only when this node can open a TCP connection to one of its addresses on one of route_probe_ports. A service
# that drops or filters this node's address range is then left out instead of being advertised and failing for every
# client. Retried route_probe_attempts times to ride out a transient loss. If NO listed host passes, the run exits
# without touching the advertised routes (that looks like this node's own outage). route_asns entries are not probed:
# they have no hostname to test.
route_verify_reachability: true
route_probe_ports: [443]
route_probe_timeout_seconds: 5
route_probe_attempts: 2
