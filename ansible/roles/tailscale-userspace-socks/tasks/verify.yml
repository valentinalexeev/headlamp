---
- name: Fetch the verify URL through the SOCKS port
  ansible.builtin.command: >-
    curl -sS --max-time 20 --socks5-hostname {{ socks_listen }} {{ socks_verify_url }}
  register: socks_verify_via
  changed_when: false
  check_mode: false

- name: Fetch the verify URL directly
  ansible.builtin.command: curl -sS --max-time 20 {{ socks_verify_url }}
  register: socks_verify_direct
  changed_when: false
  check_mode: false

- name: Show both results
  ansible.builtin.debug:
    msg:
      - "via SOCKS ({{ socks_listen }}): {{ socks_verify_via.stdout }}"
      - "direct: {{ socks_verify_direct.stdout }}"
      - >-
        The via-SOCKS address must equal the egress address of exit node
        '{{ socks_exit_node }}'; the direct address must differ from it.
