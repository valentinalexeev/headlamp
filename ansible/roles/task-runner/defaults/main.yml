---
# task-runner (apps/task-runner) as a systemd service on a VM node: a rootless
# podman container per run, an nftables guard for the service user.
# Values marked REQUIRED have no default on purpose; preflight.yml fails early
# if they are missing. Real values (token, address, digest) live in the private
# repo (vault, host_vars), never here.

# Path ON THE CONTROL HOST to the apps/task-runner directory (REQUIRED), e.g.
# "{{ playbook_dir }}/../vendor/headlamp/apps/task-runner". The Go binary is
# built from it on the control host and image/ is copied to the node.
task_runner_src: ""

# Bearer token node-control uses (REQUIRED, vault, at least 24 characters, no
# whitespace, quotes, backslash, $ or backtick; e.g. `openssl rand -hex 32`).
# Lives only in the env file; never logged, never on a command line.
task_runner_token: ""

# Tailnet address of this node (REQUIRED), e.g. "<tailnet-ip>" (what
# `tailscale ip -4` prints on the node, a 100.64.0.0/10 address; an IPv6
# tailnet address in fd7a:115c:a1e0::/48 is accepted too). The runner binds to
# it only, never 0.0.0.0; preflight checks the node really has it.
task_runner_listen_addr: ""
task_runner_port: 9100

# Roles of the node (#324): "run" (scheduled task runs) and "session" (interactive browser sessions,
# see README "Browser sessions"). Default: [run], or [run, session] when the deprecated
# task_runner_session_enabled is true. Without "session" the role builds the image stage `run` only:
# no Xvnc, noVNC, openbox or Chrome. With "session" the env file gets RUNNER_SESSION_BIND
# (= task_runner_listen_addr, so the session port is published on the tailnet address only) and
# RUNNER_SESSION_PORT. The port must differ from task_runner_port.
task_runner_roles: "{{ ['run', 'session'] if task_runner_session_enabled | bool else ['run'] }}"
# Deprecated (#324): use task_runner_roles. Removed before 1.0.0 (#374).
task_runner_session_enabled: false
task_runner_session_port: 6080
# true (default, as before #324): a run and a session exclude each other on this node, and a
# session makes the node busy for scheduled runs. false: each role has its own slot, so a
# session never blocks a scheduled run; task_runner_memory_max must then hold both containers
# (preflight checks it).
task_runner_shared_slot: true

# Base image of the run image, pinned by digest (REQUIRED unless
# task_runner_image_archive is set): "<registry>/<repository>@sha256:<64 hex>".
# The README explains how to obtain the digest of a tag.
task_runner_base_image: ""
# Optional: path ON THE CONTROL HOST to a `podman save` tarball of a ready run
# image, for nodes that cannot reach the registry. When set, the node loads it
# instead of building, and task_runner_base_image is not used.
task_runner_image_archive: ""
# Repository of the derived image on the node; the tag is a content hash.
task_runner_image_repo: localhost/task-runner
# Limits for the first pull/build (the base image is about 2.5 GB; the first
# pull has taken about 30 minutes on a small node).
task_runner_image_async: 3600
task_runner_image_poll: 30

# Optional: path ON THE CONTROL HOST to a prebuilt linux binary for the node's
# architecture. When empty, the role builds one with the control host's `go`.
task_runner_binary: ""

# Service user and locations.
task_runner_user: task-runner
# Home of the service user and the runner's state (podman storage, run dirs).
# Mode 0700. Must be /var/lib/<dir>.
task_runner_state_dir: /var/lib/task-runner
# XDG_RUNTIME_DIR of the service user (systemd RuntimeDirectory). The role's
# own podman calls use the same directory: podman refuses a storage whose
# recorded run root differs from the current one.
task_runner_runtime_dir: /run/task-runner
task_runner_env_file: /etc/task-runner/env
task_runner_bin: /usr/local/bin/task-runner
# Subordinate uid/gid range size for rootless podman (added only if the user
# has no range yet; the start is chosen after the highest existing range).
task_runner_subid_count: 65536

# Host profile (#215): the defaults of the limits, the image and the swap below come from it. Set any of
# those variables in host_vars to override one value. "default": a host with 2 GB or more. "small": a shared
# 1 vCPU / 1 GB host (bridge plus runner): lower limits, Chromium instead of Google Chrome in sessions,
# memory-saving browser flags and a swap file. See README "Smaller nodes".
task_runner_profile: default
task_runner_profiles:
  default:
    memory_max: 2G
    container_memory: 1g
    min_free_mb: 1500
    min_free_disk_mb: 6000
    session_chrome: true
    session_browser_flags: ""
    swap_mb: 0
    trim_services: false
  small:
    memory_max: 768M
    container_memory: 512m
    min_free_mb: 550
    min_free_disk_mb: 3000
    session_chrome: false
    session_browser_flags: >-
      --renderer-process-limit=2 --disable-background-networking --disable-component-update
      --disable-features=Translate,OptimizationHints,MediaRouter
    swap_mb: 1024
    trim_services: true

# Resource limits.
# Whole service (runner, podman, the container): systemd MemoryMax (K/M/G).
task_runner_memory_max: "{{ task_runner_profiles[task_runner_profile].memory_max }}"
# Per run container: RUNNER_MEMORY, podman --memory (k/m/g). Must leave at least
# 256 MB of task_runner_memory_max for the runner and podman.
task_runner_container_memory: "{{ task_runner_profiles[task_runner_profile].container_memory }}"
# Per session container: RUNNER_SESSION_MEMORY (k/m/g). With task_runner_shared_slot false, run
# and session containers can run together, so task_runner_memory_max must hold both plus 256 MB.
task_runner_session_memory: "{{ task_runner_container_memory }}"
# Per container: RUNNER_PIDS_LIMIT, podman --pids-limit.
task_runner_pids_limit: 512
# Whole service: systemd TasksMax.
task_runner_tasks_max: 2048

# Google Chrome in the session image (linux/amd64 only). false: sessions use Playwright's Chromium, a smaller
# image and no download from Google; Chromium has no proprietary media codecs.
task_runner_session_chrome: "{{ task_runner_profiles[task_runner_profile].session_chrome }}"
# Extra flags of the session browser, baked into the session image (SESSION_BROWSER_FLAGS). Do not add
# --disable-site-isolation-trials by default: it saves memory but weakens the isolation between sites.
task_runner_session_browser_flags: "{{ task_runner_profiles[task_runner_profile].session_browser_flags }}"
# Swap file /swapfile.task-runner of this size in MB (0: none, and the role removes the file it made). Runner
# memory, which can hold task secrets, can then reach the disk; see README "Smaller nodes".
task_runner_swap_mb: "{{ task_runner_profiles[task_runner_profile].swap_mb }}"
task_runner_swap_file: /swapfile.task-runner
# Remove the services that a cloud image runs but a bridge or runner node does not need (snapd, multipathd,
# about 50 to 100 MB of idle RAM on Ubuntu). Packages that are not installed are skipped. Debian cloud images do not
# have them.
task_runner_trim_services: "{{ task_runner_profiles[task_runner_profile].trim_services }}"
task_runner_trim_packages: [snapd, multipath-tools]

# Preflight thresholds (free memory without page cache; free disk on the file
# system holding task_runner_state_dir). Chromium needs a few hundred MB, the
# base and derived images a few GB.
task_runner_min_free_mb: "{{ task_runner_profiles[task_runner_profile].min_free_mb }}"
task_runner_min_free_disk_mb: "{{ task_runner_profiles[task_runner_profile].min_free_disk_mb }}"

# systemd ProtectKernelTunables= for the unit. Off: its read-only mounts over
# /proc/sys etc. become locked mounts in the container's user namespace and the
# kernel refuses the fresh /proc mount, so every run would fail. To try it,
# set true on one node after a verified run, redeploy, start a run and check
# `journalctl -u task-runner` for a proc mount error; revert if it fails.
task_runner_protect_kernel_tunables: false

# nftables guard (tasks/guard.yml).
task_runner_guard_file: /etc/task-runner-guard.nft
# Resolvers the service user (and so every container, whose traffic leaves as
# that user) may query on port 53 although they lie in a blocked range. The
# defaults are the tailnet resolver (v4 and v6). Add the systemd-resolved stub
# (127.0.0.53) if /etc/resolv.conf points at it; preflight fails when a
# blocked-range resolver from /etc/resolv.conf is missing here.
task_runner_guard_resolvers: ["100.100.100.100", "fd7a:115c:a1e0::53"]
# Extra destinations the service user may never reach: IPv4/IPv6 addresses or
# CIDRs. The guard already drops every address configured on an interface of
# this host (fib daddr type local); on a 1:1-NAT cloud the node's public
# address is NOT on any interface, so list it here (`ip -o addr` shows whether
# it is configured). Default: none.
task_runner_guard_extra_drop: []
# How often the guard check timer verifies the table exists (systemd time span).
task_runner_guard_check_interval: 30s
task_runner_nft_bin: /usr/sbin/nft
