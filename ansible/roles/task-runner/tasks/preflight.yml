---
# Read-only checks before anything is written. Failure messages name the
# variable and never print the token.
- name: Check facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family is defined
      - ansible_facts.architecture is defined
      - ansible_facts.memory_mb is defined
      - ansible_facts.mounts is defined
    fail_msg: >-
      task-runner: ansible facts are missing; do not set gather_facts: false
      for this role.
    quiet: true

- name: Check the OS and the architecture are supported
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.pkg_mgr | default('') == 'apt'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      task-runner: only Debian-family hosts with apt on x86_64 or aarch64 are
      supported. Got os_family='{{ ansible_facts.os_family }}',
      pkg_mgr='{{ ansible_facts.pkg_mgr | default('') }}',
      architecture='{{ ansible_facts.architecture }}'.
    quiet: true

- name: Check required variables are set
  ansible.builtin.assert:
    that:
      - task_runner_src | length > 0
      - task_runner_token | length > 0
      - task_runner_listen_addr | length > 0
      - (task_runner_base_image | length > 0) or (task_runner_image_archive | length > 0)
    fail_msg: >-
      task-runner: task_runner_src (control-host path to apps/task-runner),
      task_runner_token (from a vault), task_runner_listen_addr (the node's
      tailnet address) and task_runner_base_image (or task_runner_image_archive)
      must be set.
    quiet: true
  # No no_log: the failure shows the expression text and fail_msg, never the value.

- name: Check the token is long enough and has no whitespace
  ansible.builtin.assert:
    that:
      - task_runner_token | length >= 24
      - task_runner_token is regex('^[^\\s"\'\\\\$`]+\\Z')
    fail_msg: >-
      task-runner: task_runner_token must be at least 24 characters with no
      whitespace, quotes, backslash, $ or backtick (try `openssl rand -hex 32`).
      The value is not shown.
    quiet: true

- name: Check the listen address is a tailnet address and the port is valid
  ansible.builtin.assert:
    that:
      - >-
        task_runner_listen_addr is regex('^100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])(\\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){2}\\Z')
        or task_runner_listen_addr is regex('^fd7a:115c:a1e0:[0-9a-f:]+\\Z')
      - task_runner_port | string is regex('^[0-9]{1,5}\\Z')
      - 1 <= (task_runner_port | int) <= 65535
    fail_msg: >-
      task-runner: task_runner_listen_addr must be the node's tailnet address
      (IPv4 in 100.64.0.0/10, or lowercase IPv6 in fd7a:115c:a1e0::/48), never
      0.0.0.0 or a public address; task_runner_port must be 1-65535.
      Got task_runner_listen_addr='{{ task_runner_listen_addr }}',
      task_runner_port='{{ task_runner_port }}'.
    quiet: true

- name: Check the browser session port
  ansible.builtin.assert:
    that:
      - task_runner_session_port | string is regex('^[0-9]{1,5}\\Z')
      - 1 <= (task_runner_session_port | int) <= 65535
      - (task_runner_session_port | int) != (task_runner_port | int)
    fail_msg: >-
      task-runner: task_runner_session_port must be 1-65535 and differ from
      task_runner_port. Got task_runner_session_port='{{ task_runner_session_port }}',
      task_runner_port='{{ task_runner_port }}'.
    quiet: true
  when: task_runner_session_enabled | bool

- name: Check the user name and the paths
  ansible.builtin.assert:
    that:
      - task_runner_user is regex('^[a-z_][a-z0-9_-]{0,31}\\Z')
      - task_runner_state_dir is regex('^/var/lib/[A-Za-z0-9._-]+\\Z')
      - task_runner_runtime_dir is regex('^/run/[A-Za-z0-9._-]+\\Z')
      - task_runner_env_file is regex('^/etc/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\\Z')
      - task_runner_bin is regex('^/[A-Za-z0-9._/-]+\\Z')
      - task_runner_guard_file is regex('^/etc/[A-Za-z0-9._/-]+\\Z')
      - task_runner_nft_bin is regex('^/[A-Za-z0-9._/-]+\\Z')
      - task_runner_image_repo is regex('^localhost/[a-z0-9][a-z0-9._/-]*\\Z')
      - task_runner_subid_count | string is regex('^[0-9]+\\Z')
      - (task_runner_subid_count | int) >= 65536
    fail_msg: >-
      task-runner: task_runner_user must be a plain user name;
      task_runner_state_dir /var/lib/<dir>; task_runner_runtime_dir /run/<dir>;
      task_runner_env_file /etc/<dir>/<file>; task_runner_guard_file under /etc;
      task_runner_image_repo localhost/<name>; task_runner_subid_count at least
      65536; paths absolute with no spaces or shell characters.
    quiet: true

- name: Check the resource limits
  ansible.builtin.assert:
    that:
      - task_runner_memory_max is regex('^[0-9]+[KMG]\\Z')
      - task_runner_container_memory is regex('^[0-9]+[kmg]\\Z')
      - task_runner_pids_limit | string is regex('^[0-9]+\\Z')
      - (task_runner_pids_limit | int) >= 64
      - task_runner_tasks_max | string is regex('^[0-9]+\\Z')
      - (task_runner_tasks_max | int) > (task_runner_pids_limit | int)
      - task_runner_container_mb | int >= 256
      - (task_runner_container_mb | int) + 256 <= (task_runner_memory_max_mb | int)
      - task_runner_min_free_mb | string is regex('^[0-9]+\\Z')
      - task_runner_min_free_disk_mb | string is regex('^[0-9]+\\Z')
    fail_msg: >-
      task-runner: task_runner_memory_max must look like 2G (K/M/G),
      task_runner_container_memory like 1g (k/m/g), at least 256 MB and at least
      256 MB below task_runner_memory_max (room for the runner and podman);
      task_runner_pids_limit at least 64 and below task_runner_tasks_max.
      Got memory_max={{ task_runner_memory_max }}, container_memory={{ task_runner_container_memory }},
      pids_limit={{ task_runner_pids_limit }}, tasks_max={{ task_runner_tasks_max }}.
    quiet: true
  vars:
    task_runner_memory_max_mb: >-
      {{ (task_runner_memory_max[:-1] | int) * {'K': 1, 'M': 1024, 'G': 1048576}[task_runner_memory_max[-1:]] | default(0) // 1024 }}
    task_runner_container_mb: >-
      {{ (task_runner_container_memory[:-1] | int) * {'k': 1, 'm': 1024, 'g': 1048576}[task_runner_container_memory[-1:]] | default(0) // 1024 }}

- name: Check the guard inputs
  ansible.builtin.assert:
    that:
      - task_runner_guard_resolvers is sequence and task_runner_guard_resolvers is not string
      - task_runner_guard_resolvers | length > 0
      - >-
        (task_runner_guard_resolvers | select('match', '^[0-9]{1,3}(\\.[0-9]{1,3}){3}\\Z') | list | length)
        + (task_runner_guard_resolvers | select('match', '^[0-9a-f]*:[0-9a-f:]+\\Z') | list | length)
        == task_runner_guard_resolvers | length
      - task_runner_guard_check_interval is regex('^[0-9]+(s|min|h)\\Z')
      - task_runner_guard_extra_drop is sequence and task_runner_guard_extra_drop is not string
      - >-
        (task_runner_guard_extra_drop | select('match', '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}(/([0-9]|[12][0-9]|3[0-2]))?\\Z') | list | length)
        + (task_runner_guard_extra_drop | select('match', '^[0-9a-f]*:[0-9a-f:]+(/([0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))?\\Z') | list | length)
        == task_runner_guard_extra_drop | length
    fail_msg: >-
      task-runner: task_runner_guard_resolvers must be a non-empty list of IPv4
      or lowercase IPv6 addresses (resolvers the service user may query on port
      53); task_runner_guard_check_interval a systemd time span like 30s;
      task_runner_guard_extra_drop a list (may be empty) of IPv4 (octets 0-255)
      or lowercase IPv6 addresses or CIDRs.
      Got task_runner_guard_resolvers={{ task_runner_guard_resolvers }},
      task_runner_guard_extra_drop={{ task_runner_guard_extra_drop }}.
    quiet: true

# nft refuses overlapping intervals in an anonymous set, so the guard would
# not load. IPv4 entries are compared as integer ranges (a /32 for a bare
# address); IPv6 entries are only checked for exact duplicates (no range
# arithmetic here), so an overlapping IPv6 pair still fails at `nft -c`.
- name: Check task_runner_guard_extra_drop has no overlapping or duplicate entries
  ansible.builtin.assert:
    that:
      - task_runner_extra_drop_overlaps | trim | length == 0
    fail_msg: >-
      task-runner: task_runner_guard_extra_drop has overlapping or duplicate
      entries ({{ task_runner_extra_drop_overlaps | trim }}); nft rejects
      overlapping intervals in one set. Keep only the wider entry of each pair.
    quiet: true
  vars:
    task_runner_extra_drop_overlaps: >-
      {%- set ns = namespace(r4=[], s6=[], bad=[]) -%}
      {%- for e in task_runner_guard_extra_drop -%}
        {%- if e is match('^[0-9.]+(/[0-9]+)?$') -%}
          {%- set p = e.split('/') -%}
          {%- set o = p[0].split('.') | map('int') | list -%}
          {%- set bits = (p[1] | int) if p | length > 1 else 32 -%}
          {%- set ip = ((o[0] * 256 + o[1]) * 256 + o[2]) * 256 + o[3] -%}
          {%- set size = 2 ** (32 - bits) -%}
          {%- set start = ip - (ip % size) -%}
          {%- set ns.r4 = ns.r4 + [[start, start + size - 1, e]] -%}
        {%- else -%}
          {%- if (e | lower) in ns.s6 -%}
            {%- set ns.bad = ns.bad + [e ~ ' (duplicate)'] -%}
          {%- endif -%}
          {%- set ns.s6 = ns.s6 + [e | lower] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for a in ns.r4 -%}
        {%- set i = loop.index0 -%}
        {%- for b in ns.r4 -%}
          {%- if loop.index0 > i and a[0] <= b[1] and b[0] <= a[1] -%}
            {%- set ns.bad = ns.bad + [a[2] ~ ' and ' ~ b[2]] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.bad | join(', ') }}

- name: Check the base image is pinned by digest
  ansible.builtin.assert:
    that:
      - task_runner_base_image is regex('^[^@\\s]+@sha256:[0-9a-f]{64}\\Z')
    fail_msg: >-
      task-runner: task_runner_base_image must be pinned by digest,
      "<registry>/<repository>@sha256:<64 hex>" (no tag). Resolve the tag the
      pinned playwright package matches (see apps/task-runner/README.md) to its
      digest on any machine with registry access, e.g.
      `skopeo inspect --format '{{ '{{' }}.Digest{{ '}}' }}' docker://<image>:<tag>` or
      `podman pull <image>:<tag> && podman image inspect --format '{{ '{{' }}.Digest{{ '}}' }}' <image>:<tag>`
      (for a multi-arch image use the index digest from `podman manifest inspect` or the registry UI).
      Got '{{ task_runner_base_image }}'.
    quiet: true
  when: task_runner_image_archive | length == 0

- name: Stat the runner source on the control host
  ansible.builtin.stat:
    path: "{{ task_runner_src }}/{{ item }}"
  loop:
    - cmd/task-runner/main.go
    - image/Containerfile
    - image/host.js
  delegate_to: localhost
  become: false
  # A read-only stat is safe, and the answer is needed in check mode too.
  check_mode: false
  register: task_runner_src_files

- name: Check the runner source exists
  ansible.builtin.assert:
    that: task_runner_src_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      task-runner: {{ task_runner_src_files.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
      not found under {{ task_runner_src }} on the control host; task_runner_src
      must be the apps/task-runner directory.
    quiet: true

- name: Stat the prebuilt binary on the control host
  ansible.builtin.stat:
    path: "{{ task_runner_binary }}"
  delegate_to: localhost
  become: false
  check_mode: false
  register: task_runner_binary_stat
  when: task_runner_binary | length > 0

- name: Check the prebuilt binary exists
  ansible.builtin.assert:
    that: task_runner_binary_stat.stat.exists and task_runner_binary_stat.stat.isreg
    fail_msg: "task-runner: task_runner_binary '{{ task_runner_binary }}' is not a file on the control host."
    quiet: true
  when: task_runner_binary | length > 0

- name: Check Go is available on the control host
  ansible.builtin.command:
    argv: [go, version]
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false
  register: task_runner_go
  failed_when: false
  when: task_runner_binary | length == 0

- name: Fail without Go on the control host
  ansible.builtin.assert:
    that: task_runner_go.rc == 0
    fail_msg: >-
      task-runner: `go` was not found on the control host. Install Go (the
      version in apps/task-runner/go.mod) or set task_runner_binary to a
      prebuilt linux binary for the node's architecture.
    quiet: true
  when: task_runner_binary | length == 0

- name: Stat the image archive on the control host
  ansible.builtin.stat:
    path: "{{ task_runner_image_archive }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  check_mode: false
  register: task_runner_archive_stat
  when: task_runner_image_archive | length > 0

- name: Check the image archive exists
  ansible.builtin.assert:
    that: task_runner_archive_stat.stat.exists and task_runner_archive_stat.stat.isreg
    fail_msg: "task-runner: task_runner_image_archive '{{ task_runner_image_archive }}' is not a file on the control host."
    quiet: true
  when: task_runner_image_archive | length > 0

# The tag is a content hash: a change to the Containerfile, host.js or the base
# digest (or to the archive) yields a new tag and a rebuild; unchanged inputs
# keep the tag, so the build is skipped. "b-" = built on the node, "a-" = loaded.
- name: Work out the architecture, the listen address and the image tag
  ansible.builtin.set_fact:
    task_runner_goarch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
    task_runner_listen: >-
      {{ ('[' ~ task_runner_listen_addr ~ ']') if ':' in task_runner_listen_addr else task_runner_listen_addr }}:{{ task_runner_port }}
    task_runner_image: >-
      {{ task_runner_image_repo }}:{{
        ('a-' ~ task_runner_archive_stat.stat.checksum[:16]) if task_runner_image_archive | length > 0
        else ('b-' ~ ((lookup('ansible.builtin.file', task_runner_src ~ '/image/Containerfile')
                       ~ '\n--host.js--\n' ~ lookup('ansible.builtin.file', task_runner_src ~ '/image/host.js')
                       ~ '\n--base--\n' ~ task_runner_base_image) | hash('sha256'))[:16]) }}

# Free disk on the file system of the state dir (longest mount prefix; -1 =
# not found). Checked in image.yml, only when the image has to be built or
# loaded, so a rerun next to an existing image is not refused.
- name: Work out the free disk for the state directory
  ansible.builtin.set_fact:
    task_runner_free_disk_mb: >-
      {%- set ns = namespace(best=none, len=-1) -%}
      {%- for m in ansible_facts.mounts -%}
        {%- set mp = m.mount | default('') -%}
        {%- if (task_runner_state_dir == mp or task_runner_state_dir.startswith(mp.rstrip('/') ~ '/'))
              and (mp | length) > ns.len -%}
          {%- set ns.best = m -%}
          {%- set ns.len = mp | length -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ((ns.best.size_available | default(0) | int) // 1048576) if ns.best is not none else -1 }}

- name: Check whether task-runner is already running
  ansible.builtin.command:
    argv: [systemctl, is-active, task-runner]
  check_mode: false
  changed_when: false
  failed_when: false
  register: task_runner_active

# A running service (perhaps with a Chromium run in progress) uses the memory
# this check is about: only warn then.
- name: Check there is enough free memory
  ansible.builtin.assert:
    that:
      - (ansible_facts.memory_mb.nocache.free | int) >= (task_runner_min_free_mb | int)
    fail_msg: &task_runner_mem_msg >-
      task-runner: the node has {{ ansible_facts.memory_mb.nocache.free }} MB of
      memory free (without page cache); task_runner_min_free_mb is {{ task_runner_min_free_mb }}.
      See README "Smaller nodes" before lowering the threshold.
    quiet: true
  when: (task_runner_active.stdout | default('') | trim) != 'active'

- name: Warn about low free memory next to the running service
  ansible.builtin.debug:
    msg: *task_runner_mem_msg
  when:
    - (task_runner_active.stdout | default('') | trim) == 'active'
    - (ansible_facts.memory_mb.nocache.free | int) < (task_runner_min_free_mb | int)

# Same convention as the ingress-agent role: the bind address is the one
# `tailscale ip` reports on the node; the runner never binds 0.0.0.0.
- name: Read the node's tailnet addresses
  ansible.builtin.command:
    argv: [tailscale, ip]
  check_mode: false
  changed_when: false
  failed_when: false
  register: task_runner_tailscale_ip

- name: Check the node has the listen address
  ansible.builtin.assert:
    that:
      - task_runner_tailscale_ip.rc == 0
      - task_runner_listen_addr in task_runner_tailscale_ip.stdout_lines | default([]) | map('trim') | list
    fail_msg: >-
      task-runner: task_runner_listen_addr '{{ task_runner_listen_addr }}' is not
      one of the addresses `tailscale ip` reports on this node
      ({{ task_runner_tailscale_ip.stdout_lines | default([]) | join(', ') }}{{ task_runner_tailscale_ip.stderr | default('') | trim }}).
      Run the tailscale role first and use the node's own tailnet address.
    quiet: true

# Containers resolve through podman's forwarder, which queries the host's
# resolvers as the service user, so the guard must allow every resolver in
# /etc/resolv.conf that lies in a blocked range, or DNS in runs fails.
- name: Read the host's resolver configuration
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: task_runner_resolv_conf

- name: Check the service user can use every system resolver
  ansible.builtin.assert:
    that:
      - task_runner_unusable_resolvers | length == 0
    fail_msg: >-
      task-runner: /etc/resolv.conf lists resolvers {{ task_runner_unusable_resolvers }} in a range the
      nftables guard blocks for the service user (loopback, private, CGNAT/tailnet, link-local, ULA) that are
      not in task_runner_guard_resolvers. Add them there (the user may then query them on port 53 only), or DNS
      inside runs times out.
    quiet: true
  vars:
    task_runner_resolvers: >-
      {{ (task_runner_resolv_conf.content | b64decode).splitlines()
         | select('match', '^[ \t]*nameserver[ \t]+[0-9A-Fa-f.:]+[ \t]*$')
         | map('regex_replace', '^[ \t]*nameserver[ \t]+([0-9A-Fa-f.:]+)[ \t]*$', '\1')
         | map('lower') | list }}
    task_runner_unusable_resolvers: >-
      {{ task_runner_resolvers
         | select('match', '^(0[.]|10[.]|127[.]|169[.]254[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|192[.]168[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|::1$|f[cd][0-9a-f]{0,2}:|fe[89ab][0-9a-f]?:)')
         | reject('in', task_runner_guard_resolvers) | list }}

# Best effort: on a 1:1-NAT cloud the public address is not on any interface,
# so `fib daddr type local` does not cover it. Warn (never fail) when the
# inventory address is not one of the node's interface addresses and is not
# listed in task_runner_guard_extra_drop. Skipped when the address is unknown
# or not an IP literal.
- name: Warn when the inventory address is not covered by the guard
  ansible.builtin.debug:
    msg: >-
      task-runner WARNING: the inventory address {{ task_runner_public_addr }} is
      not configured on any interface of this node (1:1 NAT?), so the guard's
      "fib daddr type local" rule does not cover it and a container could reach
      this host's own services through it. Add it to task_runner_guard_extra_drop
      (check with `ip -o addr`).
  when:
    - task_runner_public_addr | length > 0
    - >-
      task_runner_public_addr is regex('^[0-9]{1,3}(\\.[0-9]{1,3}){3}\\Z')
      or task_runner_public_addr is regex('^[0-9a-fA-F]*:[0-9a-fA-F:]+\\Z')
    - (task_runner_public_addr | lower) not in task_runner_host_addrs
    - task_runner_public_addr not in task_runner_guard_extra_drop
    - (task_runner_public_addr ~ '/32') not in task_runner_guard_extra_drop
  vars:
    task_runner_public_addr: "{{ (ansible_host | default('')) | string | trim }}"
    task_runner_host_addrs: >-
      {{ ((ansible_facts.all_ipv4_addresses | default([]))
          + (ansible_facts.all_ipv6_addresses | default([]))) | map('lower') | list }}
