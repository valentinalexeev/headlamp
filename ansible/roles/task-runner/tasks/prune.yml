---
# Keep the current tag and the newest other one (for a quick rollback by
# hand); untag the rest. Runs after the service switched to the current image.
# An image still used by a container is left alone (rmi without --force).
- name: List the run images
  ansible.builtin.command:
    argv: [podman, --cgroup-manager=cgroupfs, images, --format, json, --filter, "reference={{ task_runner_image_repo }}"]
  become: true
  become_user: "{{ task_runner_user }}"
  environment:
    HOME: "{{ task_runner_state_dir }}"
    XDG_RUNTIME_DIR: "{{ task_runner_runtime_dir }}"
  register: task_runner_images
  changed_when: false
  when: not ansible_check_mode

- name: Remove old run image tags
  ansible.builtin.command:
    argv: [podman, --cgroup-manager=cgroupfs, rmi, "{{ item }}"]
  become: true
  become_user: "{{ task_runner_user }}"
  environment:
    HOME: "{{ task_runner_state_dir }}"
    XDG_RUNTIME_DIR: "{{ task_runner_runtime_dir }}"
  loop: "{{ task_runner_stale_images }}"
  register: task_runner_rmi
  changed_when: task_runner_rmi.rc == 0
  failed_when: false
  when: not ansible_check_mode
  vars:
    task_runner_stale_images: >-
      {%- set ns = namespace(tags=[]) -%}
      {%- for img in (task_runner_images.stdout | default('[]', true) | from_json) -%}
        {%- for n in img.Names | default([]) -%}
          {%- if n.startswith(task_runner_image_repo ~ ':') and n != task_runner_image -%}
            {%- set ns.tags = ns.tags + [{'name': n, 'created': img.Created | default(0) | int}] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ (ns.tags | sort(attribute='created', reverse=true) | map(attribute='name') | list)[1:] }}
