<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enrolment</title>
<style>
  :root { --bg:#0b0e14; --panel:#131824; --border:#232a3a; --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --bad:#e5534b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem 1rem; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:1.3rem; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; align-items:end; }
  label { font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:.2rem; }
  input, select, button, textarea { font:inherit; padding:.45rem .6rem; border-radius:6px; border:1px solid var(--border);
         background:var(--bg); color:var(--text); }
  button { background:var(--accent); border-color:var(--accent); cursor:pointer; }
  button.danger { background:transparent; border-color:var(--bad); color:var(--bad); }
  button.ghost { background:transparent; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--border); white-space:nowrap; }
  td.actions { display:flex; gap:.4rem; }
  div.actions { display:flex; gap:.4rem; }
  td.wrap { white-space:normal; min-width:12rem; }
  .muted { color:var(--muted); } .bad { color:var(--bad); }
  #out { display:none; }
  #syncbanner { display:none; border-color:var(--bad); color:var(--bad); }
  #ingresses { display:none; }
  .pill { font-size:.75rem; padding:.1rem .45rem; border:1px solid var(--border); border-radius:99px; }
  #out textarea { width:100%; height:5rem; }
</style>
</head>
<body>
<main>
  <h1>Enrolment</h1>
  <div class="panel" id="syncbanner" role="alert"></div>
  <div class="panel">
    <form id="create">
      <label>Name <input name="name" required maxlength="100"></label>
      <label>Owner <input name="owner" required maxlength="100"></label>
      <label>Client
        <select name="client"><option>sing-box</option><option>karing</option><option>clash</option></select>
      </label>
      <label>Expires <input name="expires" type="date" required></label>
      <button type="submit">Create device</button>
    </form>
    <p id="msg" class="muted"></p>
  </div>
  <div class="panel" id="out">
    <div id="outlabel" class="muted"></div>
    <textarea id="outtext" readonly></textarea>
    <button class="ghost" id="copy" type="button">Copy</button>
  </div>
  <div class="panel tablewrap" id="ingresses">
    <div class="muted" id="ingnote"></div>
    <table>
      <thead><tr><th>Ingress</th><th>Host</th><th>Online</th><th>Sync</th><th>Since</th><th>Approval</th><th></th></tr></thead>
      <tbody id="ingrows"></tbody>
    </table>
  </div>
  <div class="panel tablewrap">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Owner</th><th>Client</th><th>Expires</th><th>Status</th><th id="trafficth">Traffic</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const post = (url, body) => fetch(url, {
  method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})
}).then(async (r) => { if (!r.ok) throw new Error(r.status + " " + await r.text()); return r.json(); });
const say = (t, bad) => { $("#msg").textContent = t; $("#msg").className = bad ? "bad" : "muted"; };
const endOfDay = (d) => Math.floor(new Date(d + "T23:59:59").getTime() / 1000);
function show(label, text) {
  $("#out").style.display = "block"; $("#outlabel").textContent = label; $("#outtext").value = text;
}
$("#copy").onclick = () => { $("#outtext").select(); navigator.clipboard && navigator.clipboard.writeText($("#outtext").value); };

const SYNC_HINT = {
  unreachable: "agent unreachable; retried every 5 minutes",
  unauthorized: "agent refused the token (AGENT_TOKEN mismatch)",
  rejected: "agent rejected the update (xray refused the config?); see journalctl -u ingress-agent",
  conflict: "agent refused an empty credential set",
  error: "unexpected error; see the node-control log",
};
function showSync(s, rows) {
  const b = $("#syncbanner");
  if (!s || !s.pending) { b.style.display = "none"; b.textContent = ""; return; }
  const when = (t) => t ? new Date(t * 1000).toLocaleString() : "?";
  const behind = (rows || []).filter((r) => r.sync && r.sync.pending);
  if ((rows || []).length > 1 && behind.length > 0) {
    // several ingresses: name every one that is behind
    b.textContent = "ingress " + behind.map((r) => r.name).join(", ") + " out of sync since " + when(s.since) + ": "
      + behind.map((r) => r.name + " " + r.sync.state + " (" + (SYNC_HINT[r.sync.state] || "") + ")").join("; ") + "."
      + " Revocations and extensions are NOT in effect on " + (behind.length > 1 ? "those ingresses" : "that ingress") + " until this clears.";
  } else {
    b.textContent = "ingress host out of sync since " + when(s.since) + ": " + s.state + " (" + (SYNC_HINT[s.state] || "") + ")."
      + " Revocations and extensions are NOT in effect on the ingress host until this clears.";
  }
  b.style.display = "block";
}
const yesNo = (v) => v === null || v === undefined ? "-" : (v ? "yes" : "no");
// The ingress table is shown only when it has something to say: several active ingresses, or a
// discovered one that is not approved. With one ingress and nothing pending the page stays as it was.
async function loadIngresses(j) {
  const panel = $("#ingresses");
  const need = (j.ingresses || []).length > 1 || (j.pending_ingresses || []).length > 0;
  if (!need) { panel.style.display = "none"; return; }
  let list;
  try { list = await (await fetch("/enroll/ingresses")).json(); } catch (e) { return; }
  const body = $("#ingrows"); body.textContent = "";
  for (const v of list.ingresses) {
    const tr = document.createElement("tr");
    const sync = v.sync ? v.sync.state + (v.sync.pending ? " (pending)" : "") : "-";
    const since = v.sync && v.sync.since ? new Date(v.sync.since * 1000).toLocaleString() : "-";
    let appr = v.approval;
    if (v.public_key_prefix && v.approval !== "approved") appr += " (key " + v.public_key_prefix + "\u2026, id " + (v.short_id_prefix || "") + "\u2026, fingerprint " + (v.fingerprint ? v.fingerprint.slice(0, 12) : "") + "\u2026)";
    if (v.detail) appr += ": " + v.detail;
    [v.name, v.host || "-", yesNo(v.online), sync, since, appr].forEach((t, i) => {
      const td = document.createElement("td"); td.textContent = t; if (i === 5) td.className = "wrap"; tr.appendChild(td);
    });
    const td = document.createElement("td"); const box = document.createElement("div"); box.className = "actions"; td.appendChild(box);
    const btn = (label, cls, fn) => { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = fn; box.appendChild(b); };
    const base = "/enroll/ingresses/" + encodeURIComponent(v.name);
    if (v.source === "discovered" && v.fingerprint && (v.approval === "pending" || v.approval === "changed")) {
      btn("Approve", "", async () => {
        if (!confirm("Approve " + v.name + " (" + v.host + ", fingerprint " + v.fingerprint + ")? It will receive credentials and appear in every profile.")) return;
        try { const r = await post(base + "/approve", {fingerprint: v.fingerprint}); showSync(r.sync, r.ingresses); load(); } catch (e) { say(e.message, true); }
      });
    }
    if (v.source === "discovered" && v.approved) {
      btn("Remove approval", "danger", async () => {
        if (!confirm("Remove the approval of " + v.name + "? It leaves the profiles and gets no more updates (it keeps its last set).")) return;
        try { const r = await post(base + "/unapprove"); showSync(r.sync, r.ingresses); load(); } catch (e) { say(e.message, true); }
      });
    }
    tr.appendChild(td); body.appendChild(tr);
  }
  $("#ingnote").textContent = list.discovery && !list.discovery.enabled ? "Discovery is off: " + list.discovery.reason + "." : "";
  panel.style.display = "block";
}
function fmtTraffic(t) {
  if (!t) return "-";
  return Object.entries(t).map(([k, v]) => k + " " + v).join(", ");
}
async function load() {
  const r = await fetch("/enroll/devices");
  const j = await r.json();
  showSync(j.sync, j.ingresses);
  const th = $("#trafficth");
  th.textContent = j.stats_partial ? "Traffic*" : "Traffic";
  th.title = j.stats_partial ? "Partial: an ingress did not answer, so its traffic is missing." : "";
  loadIngresses(j);
  const devs = j.devices;
  const body = $("#rows"); body.textContent = "";
  for (const d of devs) {
    const tr = document.createElement("tr");
    const status = d.revoked ? "revoked" : (d.expires_at * 1000 < Date.now() ? "expired" : "active");
    for (const v of [d.id, d.name, d.owner, d.client, new Date(d.expires_at * 1000).toLocaleDateString(), status, fmtTraffic(d.traffic)]) {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    }
    const td = document.createElement("td"); td.className = "actions";
    const btn = (label, cls, fn) => { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = fn; td.appendChild(b); };
    btn("New link", "", async () => {
      try { const j = await post("/enroll/devices/" + d.id + "/links", {ttl: 86400, max_uses: 1}); show("One-time link for " + d.name + " (24 h)", j.url); }
      catch (e) { say(e.message, true); }
    });
    btn("Extend", "ghost", async () => {
      const v = prompt("New expiry date (YYYY-MM-DD)"); if (!v) return;
      try { const j = await post("/enroll/devices/" + d.id + "/extend", {expires_at: endOfDay(v)}); showSync(j.sync, j.ingresses); load(); } catch (e) { say(e.message, true); }
    });
    btn("Revoke", "danger", async () => {
      if (!confirm("Revoke " + d.name + "?")) return;
      try { const j = await post("/enroll/devices/" + d.id + "/revoke"); showSync(j.sync, j.ingresses); load(); } catch (e) { say(e.message, true); }
    });
    tr.appendChild(td); body.appendChild(tr);
  }
}
$("#create").onsubmit = async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    const j = await post("/enroll/devices", {name: f.get("name"), owner: f.get("owner"), client: f.get("client"), expires_at: endOfDay(f.get("expires"))});
    show("Subscription URL for the new device", j.subscription_url);
    say(j.sync_pending ? "Created; not yet on the ingress host (" + j.sync.state + "), retried every 5 minutes." : "Created.");
    showSync(j.sync, j.ingresses);
    ev.target.reset(); load();
  } catch (e) { say(e.message, true); }
};
load();
</script>
</body>
</html>
