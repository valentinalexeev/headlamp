app="<your-headscale-app>"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = 5

[processes]
# The image entrypoint is the headscale binary, so the process command is its arguments.
app = "serve"
# Routes are approved by the policy: `autoApprovers.routes` in acl.json (prefix -> approving tags). No approver
# process and no API key are needed.

[metrics]
port = 9090
path = "/metrics"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[mounts]
source = "headscale_data"
destination = "/data"
