<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge approval</title>
</head>
<body>
<div class="hl" id="approve">
  <div class="page narrow">
    <div>
      <a class="small t2" href="/nodes">Nodes</a>
      <h1 id="title">Bridge approval</h1>
      <p class="t2" id="sub" aria-live="polite">Loading.</p>
    </div>

    <div class="note crit" id="error" role="alert" hidden></div>
    <section class="note crit" id="changed" hidden></section>
    <div class="note plain" id="info" hidden></div>

    <section class="panel" id="review" hidden>
      <h2>Compare these with the host</h2>
      <p class="t2 small">Check them against your own source, not this page. Run this where you administer headscale:</p>
      <pre class="code">headscale nodes list</pre>
      <dl class="kv" id="fields"></dl>
    </section>

    <div class="stack" id="confirm"></div>
    <div class="rowbtns start" id="actions" hidden></div>

    <section id="tailnet" data-page="bridge" hidden>
      <h2>Tailnet access</h2>
      <p class="t2 small">Changes need the right enroll.admin. Each change goes to the audit log.</p>
      <div class="note crit" id="tailneterror" role="alert" hidden></div>
      <div class="stack" id="tailnetroot"></div>
    </section>
  </div>
</div>
<script src="/enroll/static/approve.js" defer></script>
<script src="/enroll/static/tailnet.js" defer></script>
</body>
</html>
