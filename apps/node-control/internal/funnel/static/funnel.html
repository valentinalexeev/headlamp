<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funnel</title>
</head>
<body>
<div class="hl" id="funnel">
  <div class="page">
    <div class="head">
      <div>
        <h1>Funnel</h1>
        <p class="t2" id="sub" aria-live="polite"></p>
      </div>
      <div class="rowbtns">
        <a class="btn" href="/funnel/config" id="configlink">Namespaces &amp; keys</a>
        <span id="addslot"></span>
      </div>
    </div>

    <div class="note crit" id="error" role="alert" hidden></div>
    <div class="note plain" id="notice" role="status" hidden></div>
    <section class="note" id="reportnote" role="status" hidden></section>
    <div id="panel"></div>

    <div class="chips" id="chips" role="group" aria-label="Filter routes" hidden></div>

    <div class="note plain" id="empty" hidden>
      <h2>No public routes yet</h2>
      <p class="t2" id="emptytext"></p>
    </div>

    <div class="tw" id="tablewrap" hidden>
      <table>
        <thead><tr><th>Public name</th><th>State</th><th>Target</th><th>Source</th><th>Owner</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="/funnel/static/funnel.js" defer></script>
</body>
</html>
