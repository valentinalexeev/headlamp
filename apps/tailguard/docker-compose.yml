# TailGuard — WireGuard server bridged to a Tailscale exit node. See README.md.
#
# Operator-run on the Docker host: `docker compose up -d`. Not Ansible/Terraform managed.
services:
  tailguard:
    # The headlamp image (#391): upstream tailguard at a pinned digest, tailscale at TAILSCALE_VERSION, and the
    # sidecar scripts. Pin a release X.Y.Z (or a digest), never main or latest.
    image: ghcr.io/valentinalexeev/headlamp/tailguard:0.22.0
    container_name: tailguard
    env_file: .env
    environment:
      # Never pin the exit node at boot: env is baked in at container creation, so a
      # stale IP would crashloop `tailscale up` after a reboot. exit-node-tracker
      # selects it at runtime instead (see track-exit-node.sh).
      - TS_EXIT_NODE=
      # Status page (#390): off unless TG_STATUS_PORT is set. It replaces TG_WEBUI_PORT, so an old .env that still
      # has TG_WEBUI_PORT=8088 does not open it. Compose stops with this message if the variable is missing.
      - "TG_WEBUI_PORT=${TG_STATUS_PORT?TG_STATUS_PORT is not set in .env (#390). Set TG_STATUS_PORT= (empty) to keep the status page off, or TG_STATUS_PORT=<port> to open it on wg0 and tailscale0}"
    volumes:
      - ./config:/etc/wireguard          # wg0.conf = the WireGuard SERVER config
      - ./state:/tailguard/state         # in-container tailscale state (persist!)
      - ./run:/tmp                       # tailscaled.sock, shared with exit-node-tracker
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks: [ip6net]
    # TG_BIND_ADDR (#390): the host address that the ports listen on, normally <host-lan-ip>. 0.0.0.0 = all addresses.
    ports:
      - "${TG_BIND_ADDR:?TG_BIND_ADDR is not set in .env (#390). Set TG_BIND_ADDR=<host-lan-ip> to publish the WireGuard and tailscale ports on that address only, or TG_BIND_ADDR=0.0.0.0 to publish them on all host addresses (the behaviour before #390)}:51820:51820/udp"  # WireGuard: clients hit <host-lan-ip>:51820
      - "${TG_BIND_ADDR:?TG_BIND_ADDR is not set in .env}:41642:41642/udp"  # in-container tailscale (host tailscaled owns 41641)
    restart: unless-stopped

  # Watchdog: probes real egress through the exit node; closes the WireGuard
  # listener (udp/51820) when the exit node stops forwarding, reopens it when it
  # returns. Shares tailguard's netns so probes go via the exit node and
  # iptables edits land in the same namespace. See route-health.sh.
  route-health:
    image: ghcr.io/valentinalexeev/headlamp/tailguard:0.22.0      # ships curl + iptables + the script
    container_name: tailguard-route-health
    network_mode: "service:tailguard"
    cap_add: [NET_ADMIN]
    depends_on:
      tailguard:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/route-health.sh"]
    # Override the image's HEALTHCHECK (it's /tailguard/healthcheck.sh, which is
    # for the main container and mutates the shared-netns firewall here).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f route-health.sh >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Tunables (defaults in the script): INTERVAL, FAIL_N, OK_N, WG_PORT, PROBES, GRACE
    # environment:
    #   - FAIL_N=3
    #   - OK_N=2

  # Follows the exit node across re-registrations (new IP / suffixed name): selects the
  # online exit node named $EXIT_NODE_PREFIX* with $EXIT_NODE_TAG (default tag:exit) whenever the selected one is gone.
  # Talks to tailguard's own tailscaled through the shared ./run:/tmp socket.
  exit-node-tracker:
    image: ghcr.io/valentinalexeev/headlamp/tailguard:0.22.0
    container_name: tailguard-exit-node-tracker
    network_mode: "service:tailguard"      # so the post-pin egress probe goes via the exit node
    env_file: .env
    cap_add: [NET_ADMIN]                   # derp-guard edits iptables in the shared netns
    depends_on:
      tailguard:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/track-exit-node.sh"]
    environment:
      # LAN access through the exit node (#390). No default: compose stops with this message if it is missing.
      - "TG_LAN_ACCESS=${TG_LAN_ACCESS:?TG_LAN_ACCESS is not set in .env (#390). Set TG_LAN_ACCESS=0 so that WireGuard peers reach the internet through the exit node only, or TG_LAN_ACCESS=1 so that they can also reach the LAN of the host (the behaviour before #390)}"
    volumes:
      - ./run:/tmp
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f track-exit-node.sh >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ip6net:
    enable_ipv6: true
