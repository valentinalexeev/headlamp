# Placeholder values (example.com). Keep the real file in your private repo.
---
server_url: https://headscale.example.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
private_key_path: /data/private.key
noise:
  private_key_path: /data/noise_private.key

prefixes:
  v4: 100.64.0.0/10

# With `mode: database` (and no `path`) the policy lives in headscale's database and can be changed without
# rebuilding the image, through the node-control policy console / scripts/headscale-policy.sh.
policy:
  mode: file
  path: "/etc/headscale/acl.json"

derp:
  server:
    enabled: true
    region_id: 999
    region_code: headlamp
    region_name: headlamp
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /data/derp_server_private.key
    automatically_add_embedded_derp_region: true
    # The public address of the load balancer or Elastic IP, for clients that cannot resolve the name.
    # ipv4: 203.0.113.10
  urls:
    - https://controlplane.tailscale.com/derpmap/default

# Disables the automatic check for headscale updates on startup
disable_check_updates: true

database:
  type: sqlite
  sqlite:
    path: /data/db.sqlite

log:
  format: text
  level: info

dns:
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    # - 2606:4700:4700::1111
    # - 2606:4700:4700::1001

  magic_dns: true
  base_domain: tailnet.example.com

logtail:
  enabled: false
