[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
# Roles come from the vendored core repo.
roles_path = ../vendor/headlamp/ansible/roles
# host_group_vars keeps group_vars/host_vars loading working; community.sops.sops decrypts
# *.sops.yaml files in those directories transparently (e.g. group_vars/all/vault.sops.yaml).
vars_plugins_enabled = host_group_vars, community.sops.sops
