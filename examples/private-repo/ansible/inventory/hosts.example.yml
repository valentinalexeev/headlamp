# Copy to hosts.yml (gitignored). ansible_host should be a STABLE name (your tailnet's MagicDNS
# name for the node), not a cloud IP that changes whenever the VM is recreated.
all:
  children:
    exit_nodes_vm:
      hosts:
        node1:
          ansible_host: node1.tailnet.example.com
          ansible_user: ubuntu
    route_provisioned:
      hosts:
        node1: {}
    # A Reality + Hysteria 2 bridge (#235): not an exit node, so not in exit_nodes_vm.
    bridges:
      hosts:
        bridge1:
          ansible_host: bridge1.tailnet.example.com   # the floating IP for the first run
          ansible_user: debian                        # Debian 13; "ubuntu" on an Ubuntu image
