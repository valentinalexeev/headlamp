---
# Explicit tags: modern ansible-core does not auto-tag roles with their own name.
- name: Configure VM-based exit nodes
  hosts: exit_nodes_vm
  roles:
    - role: tailscale
      tags: [tailscale]

- name: Deploy split-tunnel route provisioning
  hosts: route_provisioned
  roles:
    - role: route-provisioner
      tags: [route-provisioner]

# Bridges (#235). Read the HARD GATE in the reality-ingress README first: the bridge tag must reach only its exit node.
- name: Configure Reality + Hysteria 2 bridges
  hosts: bridges
  roles:
    - role: tailscale
      tags: [tailscale]
    - role: tailscale-userspace-socks
      tags: [tailscale-userspace-socks]
    - role: reality-ingress
      tags: [reality-ingress]
    - role: ingress-agent
      tags: [ingress-agent]
